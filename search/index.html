<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | Bramha.org</title><link rel="stylesheet" href="../assets/bramha.css"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="../">Bramha.org</a><nav class="nav"><a href="../">Home</a><a href="../tarabalam/">Tarabalam</a><a href="../dharma-sutra/">Dharma Sūtra</a><a href="../gruhya-sutra/">Gṛhya Sūtra</a><a href="../vedic-mantras/">Vedic Mantras</a><a href="../articles/">Articles</a><a class="active" href="./">Search</a></nav></div></header><main class="page"><section class="hero"><h1>Search Bramha.org</h1><p>Search across public, human-verified Dharma Sūtra and Gṛhya Sūtra content.</p></section><div class="search-box"><input id="q" placeholder="Search Sanskrit, Telugu, English, or Sūtra title…"><button id="go" class="btn">Search</button></div><div id="results" class="search-results"></div></main><script src="../assets/config.js"></script><script src="../assets/api.js"></script><script>
const q=document.getElementById('q'), out=document.getElementById('results');
async function run(){ const term=q.value.trim(); if(term.length<2){out.innerHTML='<div class="notice">Enter at least 2 characters.</div>';return;} const esc=term.replace(/[,*()]/g,' '); const filter=`or=(display_name.ilike.*${encodeURIComponent(esc)}*,sanskrit_transliteration.ilike.*${encodeURIComponent(esc)}*,telugu_script.ilike.*${encodeURIComponent(esc)}*,english_translation.ilike.*${encodeURIComponent(esc)}*)`; out.innerHTML='<div class="card">Searching…</div>'; try{ const [d,g]=await Promise.all([sbFetch(`dharma_sutras?select=unique_id,display_name,english_translation,slug&publish=eq.true&verification_status=eq.Verified&${filter}&limit=25`),sbFetch(`gruhya_sutras?select=unique_id,display_name,english_translation,slug&publish=eq.true&verification_status=eq.Verified&${filter}&limit=25`)]); const rows=[...d.map(x=>({...x,type:'Dharma Sūtra',href:`../dharma-sutra/?id=${encodeURIComponent(x.unique_id)}`})),...g.map(x=>({...x,type:'Gṛhya Sūtra',href:`../gruhya-sutra/?id=${encodeURIComponent(x.unique_id)}`}))]; if(!rows.length){out.innerHTML='<div class="card empty">No public verified matches found.</div>';return;} out.innerHTML=rows.map(r=>`<div class="result"><span class="badge">${escapeHtml(r.type)}</span><a href="${r.href}">${escapeHtml(r.display_name||r.unique_id)}</a><p>${escapeHtml((r.english_translation||'').slice(0,240))}</p></div>`).join(''); }catch(e){out.innerHTML=`<div class="notice">${escapeHtml(e.message)}</div>`;} }
document.getElementById('go').onclick=run; q.addEventListener('keydown',e=>{if(e.key==='Enter')run();});
</script></body></html>
