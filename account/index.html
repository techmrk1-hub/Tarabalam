<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Personal study | Bramha.org</title>
  <meta name="description" content="Optional bookmarks, personal notes and reading history for a signed-in reader. Public texts stay open without an account.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://bramha.org/account/">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/library.css">
</head>
<body data-nav="about">
<div id="site-header"></div>
<main id="content" class="page">
  <nav class="crumb" aria-label="Breadcrumb"><a href="/">Home</a> <span aria-hidden="true">›</span> <span aria-current="page">Personal study</span></nav>
  <h1>Personal study</h1>
  <p class="lede">Reading the library does not require an account. A signed-in reader can keep bookmarks, notes and a private reading history.</p>
  <form id="authForm" class="account-form paper-card">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password <span class="verify-note">(optional — leave blank to receive a sign-in link)</span></label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <div class="hero-actions">
      <button class="btn" type="submit" data-auth="otp">Email me a link</button>
      <button class="btn secondary" type="submit" data-auth="password">Sign in with password</button>
    </div>
    <p id="authMessage" class="verify-note" role="status"></p>
  </form>
  <div id="studyDesk"></div>
</main>
<div id="site-footer"></div>
<script src="/assets/config.js"></script>
<script type="module" src="/assets/shell.js"></script>
<script type="module" src="/assets/study.js"></script>
</body>
</html>
