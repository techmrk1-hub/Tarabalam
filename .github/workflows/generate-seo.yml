name: Generate SEO pages

# A verified Sheet article is readable at /articles/<slug>/ immediately.
# This workflow only writes the permanent HTML, sitemap, and Open Graph files.
# Run it by hand with workflow_dispatch when a new article should be crawled
# before the daily schedule. Do not poll the Sheet from Actions.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run generate:seo
      - run: npm test
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dharma-sutra gruhya-sutra vedic-mantras articles bhashyam prayoga sitemap.xml robots.txt 404.html cms/seo-manifest.json
          git diff --cached --quiet || git commit -m "Regenerate public SEO pages from the live Sheet"
          git push
