name: Generate SEO pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run generate:seo
      - run: npm test
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dharma-sutra gruhya-sutra vedic-mantras articles bhashyam prayoga sitemap.xml robots.txt public/sitemap.xml public/robots.txt 404.html cms/seo-manifest.json
          git diff --cached --quiet || git commit -m "Regenerate public SEO pages from the live Sheet"
          git push
