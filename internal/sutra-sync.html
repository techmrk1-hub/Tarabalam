<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sūtra CMS diagnostics | Bramha.org</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/library.css">
</head>
<body data-nav="about">
<div id="site-header"></div>
<main id="content" class="page">
  <h1>Sūtra CMS diagnostics</h1>
  <p>Internal status for Bramha.org - Sutra Database. Public readers show only rows marked <strong>Verified</strong> and <strong>Publish = YES</strong>.</p>
  <p><button type="button" class="btn" id="refresh">Refresh now</button></p>
  <div id="statusCards" class="sync-grid"></div>
</main>
<div id="site-footer"></div>
<script src="/assets/config.js"></script>
<script src="/assets/sheets.js"></script>
<script src="/assets/api.js"></script>
<script>
const box = document.getElementById('statusCards');
function card(title, body) { return `<section class="paper-card"><h2>${title}</h2>${body}</section>`; }
function issues(diag) {
  if (!diag) return '<p>No schema report.</p>';
  const items = [];
  if (diag.blankHeadings) items.push(`${diag.blankHeadings} blank heading(s)`);
  if (diag.duplicateHeadings?.length) items.push(`Duplicate headings: ${diag.duplicateHeadings.map(escapeHtml).join(', ')}`);
  if (diag.missingIds) items.push(`${diag.missingIds} row(s) missing an id`);
  if (diag.duplicateIds?.length) items.push(`Duplicate IDs: ${diag.duplicateIds.map(escapeHtml).join(', ')}`);
  if (diag.invalidUrls) items.push(`${diag.invalidUrls} invalid URL(s)`);
  if (!items.length) return '<p class="sync-ok">No schema or identity problems detected.</p>';
  return `<ul>${items.map((item) => `<li class="sync-err">${item}</li>`).join('')}</ul>`;
}
async function run() {
  box.innerHTML = '<p class="notice">Checking the Google Sheet…</p>';
  const results = {};
  for (const kind of ['dharma', 'gruhya', 'articles', 'mantras']) {
    try { results[kind] = await BramhaSheets.load(kind, { refresh: true }); }
    catch (error) { results[kind] = { error: error.message }; }
  }
  const st = BramhaSheets.status();
  const cfg = window.BRAMHA_CONFIG.googleSheet || {};
  box.innerHTML = [
    card('Connection', `<p>${st.connection === 'connected' ? '<span class="sync-ok">Connected</span>' : '<span class="sync-err">Error</span>'}</p><ul><li>Sheet: ${escapeHtml(cfg.name || '')}</li><li>Source: ${escapeHtml(st.source || 'none')}</li><li>Checked: ${escapeHtml(st.lastSuccessAt || '')}</li></ul>`),
    card('Public rows', `<ul><li>Dharma: ${st.counts.dharma || 0}</li><li>Gṛhya: ${st.counts.gruhya || 0}</li><li>Articles: ${st.counts.articles || 0}</li><li>Mantras: ${st.counts.mantras || 0}</li></ul>`),
    card('Validation', issues(results.dharma?.diagnostics) + issues(results.gruhya?.diagnostics)),
    card('Last error', st.lastError ? `<p class="sync-err">${escapeHtml(st.lastError.message)}</p>` : '<p class="sync-ok">None</p>')
  ].join('');
}
document.getElementById('refresh').onclick = run;
run();
</script>
<script type="module" src="/assets/shell.js"></script>
</body>
</html>
