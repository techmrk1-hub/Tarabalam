<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articles | Bramha.org</title><link rel="stylesheet" href="../assets/bramha.css"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="../">Bramha.org</a><nav class="nav"><a href="../">Home</a><a href="../tarabalam/">Tarabalam</a><a href="../dharma-sutra/">Dharma Sūtra</a><a href="../gruhya-sutra/">Gṛhya Sūtra</a><a href="../vedic-mantras/">Vedic Mantras</a><a class="active" href="./">Articles</a><a href="../search/">Search</a></nav></div></header><main class="page"><section class="hero"><h1>Articles & Research</h1><p>Verified Dharma, Śāstra and Vedic knowledge articles synchronized through the Bramha.org CMS.</p></section><div id="state" class="search-results"></div></main><script src="../assets/config.js"></script><script src="../assets/api.js"></script><script>sbFetch('articles?select=article_id,title,summary,slug,language,published_date&publish=eq.true&verification_status=eq.Verified&order=published_date.desc&limit=100').then(rows=>{const s=document.getElementById('state'); if(!rows.length){s.innerHTML='<div class="card empty">No verified articles are public yet.</div>';return;} s.innerHTML=rows.map(r=>`<div class="result"><span class="badge">${escapeHtml(r.language||'Article')}</span><strong>${escapeHtml(r.title)}</strong><p>${escapeHtml(r.summary||'')}</p></div>`).join('');}).catch(e=>document.getElementById('state').innerHTML=`<div class="notice">${escapeHtml(e.message)}</div>`);</script></body></html>
