<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vedic Texts &amp; Mantras | Bramha.org</title>
  <meta name="description" content="Verified Vedic mantra text, scripts, meanings, Prayoga or Viniyoga, and source references.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://bramha.org/vedic-mantras/">
  <meta property="og:title" content="Vedic Texts &amp; Mantras | Bramha.org">
  <meta property="og:url" content="https://bramha.org/vedic-mantras/">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/assets/library.css">
</head>
<body data-nav="vedic">
<div id="site-header"></div>
<main id="content" class="page">
  <nav class="crumb" aria-label="Breadcrumb"><a href="/">Home</a> <span aria-hidden="true">›</span> <span aria-current="page">Vedic Texts</span></nav>
  <h1>Vedic Texts &amp; Mantras</h1>
  <p class="lede">Mantras are listed only after the source record is verified and marked for publication.</p>
  <div id="mantraList" class="result-list"></div>
</main>
<div id="site-footer"></div>
<script src="/assets/config.js"></script>
<script src="/assets/seo-routes.js"></script>
<script src="/assets/seo-boot.js"></script>
<script src="/assets/sheets.js"></script>
<script src="/assets/api.js"></script>
<script>
(async () => {
  const host = document.getElementById('mantraList');
  host.innerHTML = '<p class="notice">Loading mantras…</p>';
  try {
    const loaded = await loadCmsTable('vedic_mantras');
    const rows = loaded.rows || [];
    if (!rows.length) {
      host.innerHTML = '<p class="empty">No verified mantras are currently available.</p>';
      return;
    }
    host.innerHTML = rows.map((row) => `<article class="result"><div class="badge">${escapeHtml(row.veda || row.values?.Veda || 'Veda')}</div><h2><a href="${BramhaRoutes.mantraPath(row)}">${escapeHtml(row.title || row.unique_id)}</a></h2></article>`).join('');
  } catch (error) {
    host.innerHTML = '<p class="error">Unable to load the library. Please try again.</p>';
    console.error(error);
  }
})();
</script>
<script type="module" src="/assets/shell.js"></script>
</body>
</html>
