<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vedic Mantras | Bramha.org</title><link rel="stylesheet" href="../assets/bramha.css"></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="../">Bramha.org</a><nav class="nav"><a href="../">Home</a><a href="../tarabalam/">Tarabalam</a><a href="../dharma-sutra/">Dharma Sūtra</a><a href="../gruhya-sutra/">Gṛhya Sūtra</a><a class="active" href="./">Vedic Mantras</a><a href="../articles/">Articles</a><a href="../search/">Search</a></nav></div></header><main class="page"><section class="hero"><h1>Vedic Mantras</h1><p>Verified mantra texts, meanings, Bhāṣyam, Prayoga and audio will appear here from the Bramha.org CMS.</p></section><div id="state" class="card reader"></div></main><script src="../assets/config.js"></script><script src="../assets/api.js"></script><script>sbFetch('vedic_mantras?select=mantra_id,title,veda,shakha,slug&publish=eq.true&verification_status=eq.Verified&order=title.asc&limit=200').then(rows=>{const s=document.getElementById('state'); if(!rows.length){s.innerHTML='<div class="empty">No verified mantras are public yet.</div>';return;} s.innerHTML=rows.map(r=>`<div class="result"><span class="badge">${escapeHtml(r.veda||'Veda')}</span><strong>${escapeHtml(r.title||r.mantra_id)}</strong></div>`).join('');}).catch(e=>document.getElementById('state').innerHTML=`<div class="notice">${escapeHtml(e.message)}</div>`);</script></body></html>
